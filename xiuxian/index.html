<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9f3">
<title>小仙童修仙记</title>
<link rel="icon" href="data:,">
<style>
:root{
  --robe:#8ecae6; --robe2:#5fa8d3; --aura:#a8d8ff;
  --pink:#ff8fb8; --gold:#ffc94d; --ink:#4a3b52; --card:#ffffffd9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Noto Serif CJK SC",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#e3f2ff 0%,#fdeaf5 55%,#fff6e0 100%);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;touch-action:manipulation}
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-cloud{position:absolute;background:#fff;border-radius:50px;opacity:.75;filter:blur(1px);animation:drift linear infinite}
.bg-cloud::before,.bg-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bg-cloud::before{width:55%;height:160%;left:15%;top:-70%}
.bg-cloud::after{width:40%;height:130%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

.app{position:relative;z-index:1;overflow-x:clip;max-width:520px;margin:0 auto;padding:10px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;min-height:100vh;min-height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:22px;font-weight:800;letter-spacing:2px;color:#b05b9a;text-shadow:0 2px 0 #fff}
.top-btns{display:flex;gap:8px}
.icon-btn{min-width:48px;height:48px;border:none;border-radius:24px;background:var(--card);box-shadow:0 3px 0 #e7c6dc,0 4px 12px #0000000f;font-size:20px;cursor:pointer;padding:0 12px;display:flex;align-items:center;gap:4px;font-weight:700}
.icon-btn small{font-size:14px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7c6dc}

.status{background:var(--card);border-radius:24px;padding:12px 16px;box-shadow:0 6px 18px #b05b9a18}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.realm{font-size:20px;font-weight:800}
.realm b{display:inline-block;padding:2px 12px;border-radius:14px;background:linear-gradient(135deg,#ffe3f0,#e3f0ff);color:#8a4fb8;margin-left:4px}
.energy{font-size:24px;font-weight:900;color:#e0719f;white-space:nowrap}
.bar{position:relative;height:26px;border-radius:13px;background:#f1e6f5;margin:10px 0 6px;overflow:hidden;box-shadow:inset 0 2px 4px #0000000f}
.bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:13px;background:linear-gradient(90deg,#9be7ff,#c9a7ff,#ff9ecf);transition:width .15s ease-out}
.bar.full .bar-fill{background:linear-gradient(90deg,#ffd76b,#ffb3d9,#ffd76b);background-size:200% 100%;animation:shine 1.2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#5b4169;text-shadow:0 1px 0 #fff}
.rates{font-size:14px;color:#8c7a95;font-weight:700}

.stage{position:relative;height:clamp(250px,40vh,340px);display:flex;align-items:center;justify-content:center}
.hero{position:relative;width:min(64vw,250px);aspect-ratio:200/220;border:none;background:none;padding:0;cursor:pointer;border-radius:50%;outline:none;z-index:2}
.hero:focus-visible{box-shadow:0 0 0 4px #ff8fb880}
.hero svg{width:100%;height:100%;display:block;overflow:visible;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.aura{position:absolute;left:50%;top:44%;width:min(88vw,340px);aspect-ratio:1;transform:translate(-50%,-50%) scale(var(--aura-scale,1));border-radius:50%;background:radial-gradient(circle,#ffffffee 0%,var(--aura) 32%,transparent 68%);opacity:.95;z-index:1;pointer-events:none;animation:pulse 2.4s ease-in-out infinite;transition:transform .8s}
.aura.rainbow{background:radial-gradient(circle,#fff 0%,transparent 30%),conic-gradient(from 0deg,#ffadad88,#ffd6a588,#fdffb688,#caffbf88,#9bf6ff88,#a0c4ff88,#bdb2ff88,#ffc6ff88,#ffadad88);-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%);animation:pulse 2.4s ease-in-out infinite,spin 8s linear infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes spin{to{rotate:360deg}}
.array{position:absolute;left:50%;bottom:4%;width:78%;aspect-ratio:3/1;transform:translateX(-50%);pointer-events:none;z-index:0;opacity:0;transition:opacity .6s}
.array.on{opacity:1}
.array svg{width:100%;height:100%}
.array .ring ellipse{animation:dash 3s linear infinite}
.array .ring ellipse+ellipse{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-56}}
.birds{position:absolute;left:50%;top:44%;width:0;height:0;z-index:3;pointer-events:none}
.bird{position:absolute;left:0;top:0;font-size:26px;animation:orbit 7s linear infinite}
@keyframes orbit{
  0%{transform:rotate(0deg) translateX(var(--rad,130px)) rotate(0deg) translate(-50%,-50%)}
  100%{transform:rotate(360deg) translateX(var(--rad,130px)) rotate(-360deg) translate(-50%,-50%)}
}
.hint{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:16px;font-weight:800;color:#b05b9a;pointer-events:none;animation:bob 1.6s ease-in-out infinite;z-index:3}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
.plus{position:absolute;font-size:24px;font-weight:900;color:#ff6fa8;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:rise .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.plus.small{font-size:17px;color:#6aa8e0}
.plus.big{font-size:30px;color:#ffae00}
@keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-80px}}
.spark{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;animation:burst .75s ease-out forwards;font-size:16px;line-height:12px;text-align:center}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
.stage.glow .aura{animation:glowBig 1.4s ease-out}
@keyframes glowBig{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(2);opacity:1;filter:brightness(1.4)}100%{transform:translate(-50%,-50%) scale(var(--aura-scale,1))}}

.break-wrap{display:flex;justify-content:center;min-height:0}
.break-btn{display:none;border:none;border-radius:34px;padding:14px 38px;font-size:26px;font-weight:900;color:#7a3d00;background:linear-gradient(180deg,#fff1a8,#ffc94d);box-shadow:0 6px 0 #e59e1f,0 10px 24px #ffb30055;cursor:pointer;animation:breathe 1s ease-in-out infinite;letter-spacing:3px}
.break-btn.show{display:block}
.break-btn:active{transform:translateY(4px) scale(1);box-shadow:0 2px 0 #e59e1f}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.shop{display:flex;flex-direction:column;gap:8px}
.shop h2{margin:2px 4px 0;font-size:17px;color:#8a4fb8}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:8px 10px 8px 12px;box-shadow:0 4px 14px #b05b9a14}
.item .ic{font-size:34px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#fff4fa;border-radius:16px;flex:none}
.item .info{flex:1;min-width:0}
.item .nm{font-size:17px;font-weight:800}
.item .nm span{font-size:13px;color:#fff;background:#c9a7ff;border-radius:10px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.item .ds{font-size:13px;color:#8c7a95;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{flex:none;min-width:96px;height:52px;border:none;border-radius:26px;font-size:17px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#b8f2c9,#6fd69a);color:#1e6b3e;box-shadow:0 4px 0 #43a86d}
.buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #43a86d}
.buy:disabled{background:#eee6ef;color:#b3a4ba;box-shadow:0 4px 0 #d8cadb;cursor:not-allowed}

.pet{position:absolute;z-index:6;border:none;background:radial-gradient(circle,#fff 30%,#fff0 70%);width:84px;height:84px;border-radius:50%;font-size:52px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;animation:petFly 9s linear forwards}
.pet i{font-style:normal;display:block;animation:petBob 1.1s ease-in-out infinite}
.pet::after{content:"✨";position:absolute;right:0;top:0;font-size:20px;animation:pulse 1s infinite}
@keyframes petFly{0%{left:-90px}100%{left:calc(100% + 10px)}}
@keyframes petBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,calc(-100% - 40px));background:#fff;border-radius:22px;padding:12px 20px;font-size:17px;font-weight:800;box-shadow:0 8px 24px #b05b9a33;z-index:40;transition:transform .35s cubic-bezier(.3,1.4,.6,1);width:max-content;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}

.modal{position:fixed;inset:0;background:#4a3b5255;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.card{background:#fff;border-radius:30px;padding:26px 22px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px #0000002a;animation:popIn .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.card .big{font-size:64px;line-height:1.1}
.card h3{font-size:26px;margin:10px 0 6px;color:#b05b9a}
.card p{font-size:18px;margin:6px 0 16px;line-height:1.6}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:28px;min-width:120px;height:56px;padding:0 22px;font-size:20px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#ffc2dc,#ff8fb8);color:#fff;box-shadow:0 5px 0 #e0689a;text-shadow:0 1px 0 #d85a8c}
.btn.gray{background:linear-gradient(180deg,#f3eef5,#dcd2e0);color:#6d5c75;box-shadow:0 5px 0 #bfb1c6;text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e0689a}
#win .card{background:linear-gradient(180deg,#fffdf0,#fff0f8)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:49;display:none}

@media (min-width:900px){
  .app{max-width:560px;padding-top:24px}
  .title{font-size:28px}
}
@media (max-height:700px){
  .stage{height:230px}
  .hero{width:min(52vw,200px)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .pet{animation:none;left:40%}
}
</style>
</head>
<body>
<div class="bg-deco" id="bgDeco"></div>
<div class="app">
  <div class="topbar">
    <div class="title">☁️ 小仙童修仙记</div>
    <div class="top-btns">
      <button class="icon-btn" id="muteBtn" aria-label="声音开关">🔊</button>
      <button class="icon-btn" id="resetBtn" aria-label="重新开始">🔄<small>重来</small></button>
    </div>
  </div>

  <div class="status">
    <div class="row">
      <div class="realm">境界<b id="realmName">练气</b></div>
      <div class="energy">✨<span id="energy">0</span></div>
    </div>
    <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div><div class="bar-text" id="barText">修为 0 / 100</div></div>
    <div class="row rates"><span>👆 点一下 +<span id="perTap">1</span></span><span>🦢 每秒 +<span id="perSec">0</span></span></div>
  </div>

  <div class="stage" id="stage">
    <div class="array" id="array"><svg viewBox="0 0 200 66"><g class="ring"><ellipse cx="100" cy="33" rx="95" ry="30" fill="none" stroke="#c9a7ff" stroke-width="3" stroke-dasharray="8 6"/><ellipse cx="100" cy="33" rx="70" ry="21" fill="none" stroke="#ffb3d9" stroke-width="2.5" stroke-dasharray="3 5"/></g></svg></div>
    <div class="aura" id="aura"></div>
    <button class="hero" id="hero" aria-label="点我打坐修炼">
      <svg viewBox="0 0 200 220" aria-hidden="true">
        <g id="halo" style="display:none">
          <ellipse cx="100" cy="14" rx="30" ry="8" fill="none" stroke="#ffd84d" stroke-width="6"/>
          <ellipse cx="100" cy="14" rx="30" ry="8" fill="none" stroke="#fff6c2" stroke-width="2"/>
        </g>
        <!-- cloud -->
        <g fill="#ffffff" stroke="#dbe9ff" stroke-width="2">
          <ellipse cx="100" cy="192" rx="84" ry="20"/>
          <circle cx="45" cy="180" r="20"/><circle cx="155" cy="180" r="20"/>
          <circle cx="75" cy="174" r="22"/><circle cx="125" cy="174" r="22"/>
        </g>
        <ellipse cx="100" cy="190" rx="80" ry="16" fill="#ffffff"/>
        <!-- legs -->
        <ellipse cx="100" cy="166" rx="54" ry="17" fill="var(--robe2)"/>
        <!-- body -->
        <path d="M58 168 Q58 112 100 106 Q142 112 142 168 Z" fill="var(--robe)"/>
        <path d="M86 108 L100 130 L114 108" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="66" y="136" width="68" height="8" rx="4" fill="#fff" opacity=".8"/>
        <!-- sleeves and hands -->
        <ellipse cx="80" cy="153" rx="17" ry="11" fill="var(--robe2)"/>
        <ellipse cx="120" cy="153" rx="17" ry="11" fill="var(--robe2)"/>
        <circle cx="100" cy="152" r="10" fill="#ffe0c7"/>
        <!-- head -->
        <circle cx="100" cy="76" r="37" fill="#ffe3cc"/>
        <path d="M62 80 Q60 38 100 38 Q140 38 138 80 Q130 58 100 56 Q70 58 62 80 Z" fill="#5a4163"/>
        <circle cx="100" cy="32" r="14" fill="#5a4163"/>
        <rect x="80" y="29" width="40" height="5" rx="2.5" fill="#ffc94d"/>
        <circle cx="120" cy="31.5" r="4" fill="#7fd6b0"/>
        <path id="mark" d="M100 58 L104 64 L100 70 L96 64 Z" fill="#ff6f91" style="display:none"/>
        <path d="M80 80 Q87 87 94 80" fill="none" stroke="#4a3b52" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M106 80 Q113 87 120 80" fill="none" stroke="#4a3b52" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="78" cy="92" rx="7" ry="4.5" fill="#ff9fbf" opacity=".7"/>
        <ellipse cx="122" cy="92" rx="7" ry="4.5" fill="#ff9fbf" opacity=".7"/>
        <path d="M94 95 Q100 101 106 95" fill="none" stroke="#e0719f" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="birds" id="birds"></div>
    <div class="hint" id="hint">👆 点点小仙童，打坐修炼！</div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="break-wrap"><button class="break-btn" id="breakBtn">🌟 突破！</button></div>

  <div class="shop">
    <h2>🛍️ 仙家宝物</h2>
    <div id="shopList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="breakModal" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big" id="bmIcon">🌟</div>
    <h3 id="bmTitle">突破成功！</h3>
    <p id="bmText"></p>
    <div class="btns"><button class="btn" id="bmOk">好耶！</button></div>
  </div>
</div>

<div class="modal" id="confirmModal" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big">🤔</div>
    <h3>要重新开始吗？</h3>
    <p>现在的修为会没有哦。</p>
    <div class="btns"><button class="btn gray" id="cfNo">不要</button><button class="btn" id="cfYes">要</button></div>
  </div>
</div>

<div class="modal" id="win" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big">🌈🧚🌈</div>
    <h3>飞升成仙啦！</h3>
    <p>你真棒！你是天上<br>最可爱的小仙人！<br><span id="winStats" style="font-size:15px;color:#8c7a95"></span></p>
    <div class="btns"><button class="btn" id="againBtn">再玩一次</button></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";
var SAVE_KEY="xiuxian-kids-save-v1";
var REALMS=[
  {name:"练气",need:100,  robe:"#8ecae6",robe2:"#5fa8d3",aura:"#a9d6ff"},
  {name:"筑基",need:1200, robe:"#95d5b2",robe2:"#5fb98a",aura:"#9ff0c0",msg:"你的身体变得更结实啦！灵气跑得更快了！"},
  {name:"金丹",need:10000,robe:"#ffd166",robe2:"#f4a93c",aura:"#ffe070",msg:"肚子里结出一颗亮晶晶的金丹！头上还有光圈哦！"},
  {name:"元婴",need:70000,robe:"#f7a8c8",robe2:"#e57aa6",aura:"#ffa8cf",msg:"你长出了一个小小的元婴宝宝，好可爱！"},
  {name:"化神",need:350000,robe:"#c8b6ff",robe2:"#9d86f0",aura:"#c2abff",msg:"你的心像天空一样大，离成仙只差一步啦！"},
  {name:"飞升成仙",need:0,robe:"#ffffff",robe2:"#ffd6ec",aura:"#fff",msg:"彩虹桥出现啦！你飞上天，变成小仙人啦！"}
];
var REALM_MULT=[1,1.5,2,3,4,4];
var UPGRADES=[
  {id:"herb", icon:"🌿",name:"灵草",  base:15, grow:1.45,desc:function(){return "点一下多得灵气";}},
  {id:"crane",icon:"🦢",name:"小仙鹤帮手",base:40,grow:1.5,desc:function(){return "自动帮你收集灵气";}},
  {id:"array",icon:"🔮",name:"聚灵阵",base:250,grow:2.6,desc:function(){return "所有灵气变多一半";}}
];
var PETS=[
  {e:"🦊",n:"小狐狸"},{e:"🐼",n:"小熊猫"},{e:"🐰",n:"小白兔"},{e:"🍑",n:"仙桃"},{e:"🐱",n:"小灵猫"}
];

function fresh(){return {v:1,e:0,x:0,r:0,l:[0,0,0],taps:0,time:0,muted:false};}
var S=fresh();
function num(v,d){return (typeof v==="number"&&isFinite(v)&&v>=0)?v:d;}
function load(){
  try{
    var raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    var o=JSON.parse(raw); if(!o||o.v!==1) return;
    S.e=num(o.e,0); S.x=num(o.x,0); S.r=Math.min(5,Math.floor(num(o.r,0)));
    if(Array.isArray(o.l)) for(var i=0;i<3;i++) S.l[i]=Math.floor(num(o.l[i],0));
    S.taps=num(o.taps,0); S.time=num(o.time,0); S.muted=!!o.muted;
  }catch(err){ /* ignore bad save */ }
}
var dirty=false;
function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));dirty=false;}catch(err){}
}

/* ---------- numbers ---------- */
function trim(s){return s.replace(/\.0$/,"");}
function fmt(n){
  n=Math.floor(n);
  if(n<10000) return String(n);
  if(n<1e8) return trim((Math.floor(n/1000)/10).toFixed(1))+"万";
  return trim((Math.floor(n/1e7)/10).toFixed(1))+"亿";
}
function fmtRate(n){ if(n>0&&n<10&&Math.round(n)!==n) return n.toFixed(1); return fmt(Math.round(n)); }

/* ---------- formulas ---------- */
function mult(){return (1+0.5*S.l[2])*REALM_MULT[S.r];}
function tapGain(){return Math.max(1,Math.round((1+S.l[0])*mult()));}
function autoRate(){return S.l[1]*2*mult();}
function cost(i){var u=UPGRADES[i];return Math.ceil(u.base*Math.pow(u.grow,S.l[i]));}
function need(){return REALMS[S.r].need;}

/* ---------- sound ---------- */
var AC=null, master=null;
function audio(){
  if(S.muted) return null;
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); master=AC.createGain(); master.gain.value=0.18; master.connect(AC.destination);}
    if(AC.state==="suspended") AC.resume();
  }catch(err){return null;}
  return AC;
}
function tone(freq,start,dur,type,vol){
  var ac=audio(); if(!ac) return;
  var t=ac.currentTime+(start||0);
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.6,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
var PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
var lastTapSound=0;
var SFX={
  tap:function(){var now=performance.now(); if(now-lastTapSound<45) return; lastTapSound=now; tone(PENTA[Math.floor(Math.random()*PENTA.length)],0,0.18,"sine",0.45);},
  buy:function(){tone(659.25,0,0.12,"triangle");tone(987.77,0.08,0.2,"triangle");},
  no:function(){tone(300,0,0.12,"sine",0.3);},
  pet:function(){[1046.5,1318.5,1568,2093].forEach(function(f,i){tone(f,i*0.06,0.2,"sine",0.4);});},
  ready:function(){tone(784,0,0.15,"triangle");tone(1046.5,0.12,0.25,"triangle");},
  breakthrough:function(){[523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){tone(f,i*0.09,0.4,"triangle",0.5);});},
  win:function(){[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5,1568,2093].forEach(function(f,i){tone(f,i*0.12,0.45,"triangle",0.5);});}
};

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var el={
  energy:$("energy"),realm:$("realmName"),bar:$("bar"),barFill:$("barFill"),barText:$("barText"),
  perTap:$("perTap"),perSec:$("perSec"),stage:$("stage"),hero:$("hero"),fx:$("fx"),aura:$("aura"),
  halo:$("halo"),mark:$("mark"),array:$("array"),birds:$("birds"),hint:$("hint"),breakBtn:$("breakBtn"),
  shop:$("shopList"),toast:$("toast"),mute:$("muteBtn")
};

/* background clouds */
(function(){
  var d=$("bgDeco");
  for(var i=0;i<5;i++){
    var c=document.createElement("div"); c.className="bg-cloud";
    var w=80+Math.random()*90; c.style.width=w+"px"; c.style.height=(w*0.32)+"px";
    c.style.top=(5+i*19+Math.random()*6)+"%";
    c.style.animationDuration=(40+Math.random()*40)+"s";
    c.style.animationDelay=(-Math.random()*60)+"s";
    d.appendChild(c);
  }
})();

/* shop */
var shopEls=[];
UPGRADES.forEach(function(u,i){
  var row=document.createElement("div"); row.className="item";
  row.innerHTML='<div class="ic">'+u.icon+'</div><div class="info"><div class="nm">'+u.name+'<span>0级</span></div><div class="ds"></div></div><button class="buy"></button>';
  el.shop.appendChild(row);
  var b=row.querySelector(".buy");
  b.addEventListener("click",function(){buy(i,b);});
  shopEls.push({lv:row.querySelector(".nm span"),ds:row.querySelector(".ds"),btn:b});
});

/* ---------- effects ---------- */
var fxCount=0;
function stagePoint(clientX,clientY){
  var r=el.stage.getBoundingClientRect();
  return {x:clientX-r.left,y:clientY-r.top};
}
function heroCenter(){
  var s=el.stage.getBoundingClientRect(), h=el.hero.getBoundingClientRect();
  return {x:h.left-s.left+h.width/2,y:h.top-s.top+h.height*0.42};
}
function floatText(text,x,y,cls){
  if(fxCount>70) return;
  var d=document.createElement("div"); d.className="plus"+(cls?" "+cls:""); d.textContent=text;
  d.style.left=x+"px"; d.style.top=y+"px";
  fxCount++; d.addEventListener("animationend",function(){d.remove();fxCount--;});
  el.fx.appendChild(d);
}
var SPARK_CH=["✦","✧","⭐","💫","🌸"];
var SPARK_COL=["#ffd84d","#ff8fb8","#9be7ff","#c9a7ff","#8ef0b5"];
function sparkles(x,y,n,spread){
  for(var i=0;i<n;i++){
    if(fxCount>90) return;
    var s=document.createElement("div"); s.className="spark";
    s.textContent=SPARK_CH[Math.floor(Math.random()*SPARK_CH.length)];
    s.style.color=SPARK_COL[Math.floor(Math.random()*SPARK_COL.length)];
    var a=Math.random()*Math.PI*2, dist=(spread||60)*(0.5+Math.random()*0.7);
    s.style.setProperty("--dx",Math.cos(a)*dist+"px"); s.style.setProperty("--dy",Math.sin(a)*dist+"px");
    s.style.left=x+"px"; s.style.top=y+"px";
    fxCount++; s.addEventListener("animationend",function(){this.remove();fxCount--;});
    el.fx.appendChild(s);
  }
}
var toastTimer=0;
function toast(msg){
  el.toast.textContent=msg; el.toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.toast.classList.remove("show");},2200);
}

/* ---------- core ---------- */
function gain(n){
  S.e+=n;
  if(S.r<5) S.x=Math.min(need(),S.x+n);
  dirty=true;
}
var hintHidden=false;
function doTap(x,y){
  if(S.r>=5) return;
  var g=tapGain(); gain(g); S.taps++;
  floatText("+"+fmt(g),x+(Math.random()*30-15),y-10);
  sparkles(x,y,5,55);
  SFX.tap();
  try{el.hero.animate([{transform:"scale(1)"},{transform:"scale(0.93,0.9)"},{transform:"scale(1.04)"},{transform:"scale(1)"}],{duration:220,easing:"ease-out"});}catch(err){}
  if(!hintHidden&&S.taps>=8){hintHidden=true;el.hint.style.opacity="0";el.hint.style.transition="opacity .6s";}
  render();
}
el.hero.addEventListener("pointerdown",function(ev){
  ev.preventDefault();
  var p=stagePoint(ev.clientX,ev.clientY); doTap(p.x,p.y);
});
el.hero.addEventListener("click",function(ev){
  if(ev.detail===0){var c=heroCenter();doTap(c.x,c.y);} // keyboard
});
el.hero.addEventListener("contextmenu",function(ev){ev.preventDefault();});

function buy(i,btn){
  var c=cost(i);
  if(S.e<c){SFX.no();toast("灵气还不够哦，再修炼一会儿～");return;}
  S.e-=c; S.l[i]++; dirty=true;
  SFX.buy();
  var r=btn.getBoundingClientRect();
  var names=["灵草长高啦！点一下更多灵气！","小仙鹤来帮忙啦！","聚灵阵转起来啦！灵气变多了！"];
  toast(UPGRADES[i].icon+" "+names[i]);
  applyVisuals();
  render(); save();
}

function applyVisuals(){
  var R=REALMS[S.r], root=document.documentElement.style;
  root.setProperty("--robe",R.robe); root.setProperty("--robe2",R.robe2); root.setProperty("--aura",R.aura);
  el.aura.style.setProperty("--aura-scale",(1+S.r*0.13).toFixed(2));
  el.aura.classList.toggle("rainbow",S.r>=5);
  el.halo.style.display=S.r>=2?"":"none";
  el.mark.style.display=S.r>=3?"":"none";
  el.array.classList.toggle("on",S.l[2]>0);
  // birds
  var want=Math.min(S.l[1],5);
  if(el.birds.childNodes.length!==want){
    el.birds.innerHTML="";
    var rad=Math.round(Math.min(el.hero.getBoundingClientRect().width*0.52,el.stage.getBoundingClientRect().width/2-22))||120;
    for(var i=0;i<want;i++){
      var b=document.createElement("span"); b.className="bird"; b.textContent="🦢";
      b.style.setProperty("--rad",rad+"px");
      b.style.animationDelay=(-i*7/want)+"s";
      el.birds.appendChild(b);
    }
  }
  el.breakBtn.textContent=S.r===4?"🌈 飞升成仙！":"🌟 突破！";
  el.mute.textContent=S.muted?"🔇":"🔊";
}

var lastReady=false, shown={};
function setText(node,key,val){ if(shown[key]!==val){shown[key]=val;node.textContent=val;} }
function render(){
  setText(el.energy,"e",fmt(S.e));
  setText(el.realm,"r",REALMS[S.r].name);
  setText(el.perTap,"pt",fmt(tapGain()));
  setText(el.perSec,"ps",fmtRate(autoRate()));
  var ready=false;
  if(S.r<5){
    var n=need(), pct=Math.min(100,S.x/n*100);
    ready=S.x>=n;
    el.barFill.style.width=pct.toFixed(1)+"%";
    setText(el.barText,"bt",ready?"修为满啦！快点突破！":"修为 "+fmt(S.x)+" / "+fmt(n));
  }else{
    el.barFill.style.width="100%";
    setText(el.barText,"bt","🌈 已经成仙啦！");
  }
  el.bar.classList.toggle("full",ready||S.r>=5);
  el.breakBtn.classList.toggle("show",ready);
  if(ready&&!lastReady){SFX.ready();}
  lastReady=ready;
  for(var i=0;i<UPGRADES.length;i++){
    var c=cost(i), se=shopEls[i];
    setText(se.lv,"lv"+i,S.l[i]+"级");
    setText(se.btn,"c"+i,"✨"+fmt(c));
    setText(se.ds,"d"+i,UPGRADES[i].desc());
    var dis=S.e<c; if(se.btn.disabled!==dis) se.btn.disabled=dis;
  }
}

/* ---------- breakthrough ---------- */
var modalOpen=false;
function openModal(id){$(id).classList.add("show");modalOpen=true;}
function closeModal(id){$(id).classList.remove("show");modalOpen=$("breakModal").classList.contains("show")||$("confirmModal").classList.contains("show")||$("win").classList.contains("show");}
el.breakBtn.addEventListener("click",function(){
  if(S.r>=5||S.x<need()) return;
  S.r++; S.x=0; dirty=true; save();
  applyVisuals(); render();
  SFX.breakthrough();
  el.stage.classList.remove("glow"); void el.stage.offsetWidth; el.stage.classList.add("glow");
  var c=heroCenter();
  sparkles(c.x,c.y,36,170);
  floatText("突破！",c.x,c.y-40,"big");
  var R=REALMS[S.r];
  setTimeout(function(){
    $("bmIcon").textContent=S.r>=5?"🌈":["","🌱","🟡","👶","🌟"][S.r];
    $("bmTitle").textContent=S.r>=5?"飞升成仙！":"突破到"+R.name+"！";
    $("bmText").textContent=R.msg;
    $("bmOk").textContent=S.r>=5?"去天上看看！":"好耶！";
    openModal("breakModal");
  },650);
});
$("bmOk").addEventListener("click",function(){
  closeModal("breakModal");
  if(S.r>=5) showWin();
});

/* ---------- win ---------- */
function showWin(){
  var m=Math.floor(S.time/60), s=Math.floor(S.time%60);
  $("winStats").textContent="用时 "+m+" 分 "+s+" 秒 · 打坐 "+fmt(S.taps)+" 次";
  openModal("win"); SFX.win(); startConfetti();
}
$("againBtn").addEventListener("click",function(){
  closeModal("win"); stopConfetti(); resetGame();
});
var cv=$("confetti"), ctx=cv.getContext("2d"), pieces=[], confRAF=0;
function startConfetti(){
  cv.style.display="block"; cv.width=innerWidth; cv.height=innerHeight; pieces=[];
  var cols=["#ff8fb8","#ffd84d","#9be7ff","#c9a7ff","#8ef0b5","#ffb38a"];
  for(var i=0;i<160;i++) pieces.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,w:6+Math.random()*7,h:8+Math.random()*8,c:cols[i%cols.length],vy:1.5+Math.random()*2.5,vx:Math.random()*2-1,a:Math.random()*6,va:Math.random()*0.2-0.1});
  cancelAnimationFrame(confRAF);
  (function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pieces.forEach(function(p){
      p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/30)*0.6; p.a+=p.va;
      if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width;}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    confRAF=requestAnimationFrame(step);
  })();
}
function stopConfetti(){cancelAnimationFrame(confRAF);cv.style.display="none";}

/* ---------- reset ---------- */
function resetGame(){
  var muted=S.muted; S=fresh(); S.muted=muted;
  removePet(); nextEvent=15;
  hintHidden=false; el.hint.style.opacity="1";
  el.fx.innerHTML=""; fxCount=0;
  applyVisuals(); render(); save();
  toast("🌱 重新开始修炼吧！");
}
$("resetBtn").addEventListener("click",function(){openModal("confirmModal");});
$("cfNo").addEventListener("click",function(){closeModal("confirmModal");});
$("cfYes").addEventListener("click",function(){closeModal("confirmModal");stopConfetti();closeModal("win");resetGame();});
el.mute.addEventListener("click",function(){
  S.muted=!S.muted; dirty=true;
  if(S.muted&&AC&&AC.state==="running"){try{AC.suspend();}catch(err){}}
  applyVisuals(); save();
  if(!S.muted) SFX.buy();
});

/* ---------- random pet / peach ---------- */
var nextEvent=15, petEl=null, petTimer=0;
function removePet(){ if(petEl){petEl.remove();petEl=null;} clearTimeout(petTimer); }
function spawnPet(){
  var p=PETS[Math.floor(Math.random()*PETS.length)];
  var b=document.createElement("button"); b.className="pet"; b.setAttribute("aria-label",p.n);
  b.innerHTML="<i>"+p.e+"</i>";
  b.style.top=(8+Math.random()*45)+"%";
  b.addEventListener("pointerdown",function(ev){
    ev.preventDefault(); ev.stopPropagation();
    if(b.dataset.got) return; b.dataset.got="1";
    var bonus=Math.max(30,Math.round(tapGain()*15+autoRate()*15));
    gain(bonus);
    var pt=stagePoint(ev.clientX,ev.clientY);
    floatText("+"+fmt(bonus),pt.x,pt.y-20,"big"); sparkles(pt.x,pt.y,16,90);
    SFX.pet();
    toast(p.e+" "+p.n+"送你 "+fmt(bonus)+" 灵气！谢谢你！");
    b.style.transition="transform .3s,opacity .3s"; b.style.transform="scale(1.6)"; b.style.opacity="0";
    setTimeout(removePet,300);
    render(); save();
  });
  b.addEventListener("animationend",function(ev){ if(ev.animationName==="petFly") removePet(); });
  el.stage.appendChild(b); petEl=b;
  petTimer=setTimeout(removePet,9500);
}

/* ---------- loop ---------- */
var last=performance.now(), saveAcc=0;
function loop(now){
  var dt=Math.min(0.25,Math.max(0,(now-last)/1000)); last=now;
  if(S.r<5&&!modalOpen){
    S.time+=dt;
    var a=autoRate();
    if(a>0){ gain(a*dt); }
    nextEvent-=dt;
    if(nextEvent<=0&&!petEl){ spawnPet(); nextEvent=25+Math.random()*20; }
  }
  // crane pops
  craneAcc+=dt;
  if(craneAcc>=1){ craneAcc=0; if(S.l[1]>0&&S.r<5&&!modalOpen){ var c=heroCenter(); floatText("+"+fmtRate(autoRate()),c.x+(Math.random()*120-60),c.y-60,"small"); } }
  render();
  saveAcc+=dt; if(saveAcc>3){saveAcc=0; if(dirty) save();}
  requestAnimationFrame(loop);
}
var craneAcc=0;
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });
window.addEventListener("pagehide",save);
window.addEventListener("resize",function(){ el.birds.innerHTML=""; applyVisuals(); });

/* ---------- start ---------- */
load();
applyVisuals(); render();
if(S.taps>=8){hintHidden=true;el.hint.style.opacity="0";}
if(S.r>=5){ setTimeout(showWin,300); }
requestAnimationFrame(loop);
window.__xiuxian={state:function(){return S;}};
})();
</script>
