<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>剧本杀-角色1</title>
    <style>
        /* 全局样式：适配所有屏幕 */
        html, body {
            background-color: #000;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation; /* 优化移动端点击体验 */
        }
        .image-wrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer; /* 电脑端显示点击光标 */
            -webkit-tap-highlight-color: transparent; /* 去除移动端点击高亮 */
        }
        .full-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 替换fill，保持图片比例且完整显示 */
            display: block;
            margin: 0 auto; /* 图片居中 */
        }
        /* 选项容器：按屏幕比例定位，适配所有设备 */
        .choices-wrapper {
            position: absolute;
            bottom: 3vh; /* 距离底部3%，替代固定15px */
            left: 0;
            width: 100%;
            padding: 0 3vw; /* 左右内边距3%，替代固定15px */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2vh; /* 选项间距2%，替代固定10px */
            z-index: 999; /* 确保选项在图片上方 */
        }
        /* 选项按钮：适配所有屏幕 */
        .choice-btn {
            padding: 2vh 1vw; /* 内边距按比例 */
            background-color: rgba(255,255,255,0.9);
            color: #333;
            font-size: clamp(14px, 2vw, 20px); /* 文字大小：最小14px，最大20px */
            border-radius: 1.5vh; /* 圆角按比例 */
            border: none;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s ease; /* 点击过渡效果 */
        }
        .choice-btn:hover {
            background-color: rgba(255,255,255,1);
        }
        .choice-btn:active {
            background-color: rgba(240,240,240,0.9);
        }
        /* 加载提示：适配小屏 */
        .loading-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: clamp(16px, 2.5vw, 24px);
            z-index: 998;
        }
    </style>
</head>
<body>
    <div class="image-wrapper" id="imageWrapper" onclick="switchImage()">
        <!-- 加载提示 -->
        <div class="loading-tip" id="loadingTip">加载中...</div>
        <img class="full-image" id="currentImg" src="" alt="剧情图片">
        <div class="choices-wrapper" id="choicesWrapper" style="display: none;">
            <!-- 选项按钮动态生成 -->
        </div>
    </div>

    <script>
        const scenes = [
            // 第八幕2
            {
                name: "第八幕2",
                photos: [
                    "./图片/商人/第八幕/Frame 3.png",
                    "./图片/商人/第八幕/Frame 1.png", 
                    "./图片/商人/第八幕/Group 12.png",
                    "./图片/商人/第八幕/Group 13.png",
                    "./图片/商人/第八幕/Group 20.png",
                    "./图片/商人/第八幕/Group 21.png",
                    "./图片/商人/第八幕/Group 14.png",
                    "./图片/商人/第八幕/Group 2.png",
                    "./图片/商人/第八幕/023df3648422e18d6a519f7e028ba2bd 1.png",
                    "./图片/商人/第八幕/拿着章程众人 1.png",
                    "./图片/商人/第八幕/Group 15.png",
                    "./图片/商人/第八幕/Group 16.png",
                    "./图片/商人/第八幕/感谢叔伯.png"
                ]
            },
            // 第八幕3
            {
                name: "第八幕3",
                photos: [
                    "./图片/商人/第八幕/雪地感谢.png",
                    "./图片/商人/第八幕/沈砚送粮食.png",
                    "./图片/商人/第八幕/送粮食.png",
                    "./图片/商人/第八幕/共守太平.png",
                    "./图片/商人/第八幕/战争图.png",
                    "./图片/商人/第八幕/图片融合-6 1.png",
                    "./图片/商人/第八幕/共守太平 (1).png"
                ]
            }
        ];

        // 页面状态管理：新增isEnd标识，标记是否到了所有内容的最后一张
        let state = {
            currentSceneIndex: 0,
            currentPhotoIndex: 0,
            currentImg: "",
            showChoices: false,
            currentChoices: [],
            isEnd: false // 新增：是否已播放至最后一张图，初始为false
        };

        // DOM元素：提前缓存，避免重复查找
        const imageWrapper = document.getElementById('imageWrapper');
        const currentImg = document.getElementById('currentImg');
        const choicesWrapper = document.getElementById('choicesWrapper');
        const loadingTip = document.getElementById('loadingTip');

        // 初始化加载：增加错误处理
        window.onload = function() {
            try {
                loadCurrentImage();
            } catch (e) {
                console.error("初始化加载失败：", e);
                alert("页面加载失败，请刷新重试！");
            }
        };

        // 加载当前图片：修复核心逻辑，增加加载提示
        function loadCurrentImage() {
            // 显示加载提示
            loadingTip.style.display = "block";
            
            const { currentSceneIndex, currentPhotoIndex } = state;
            // 边界检查：防止索引越界
            if (!scenes[currentSceneIndex] || !scenes[currentSceneIndex].photos[currentPhotoIndex]) {
                alert("当前剧情不存在，请返回上一页！");
                window.history.back();
                return;
            }

            const currentScene = scenes[currentSceneIndex];
            const currentItem = currentScene.photos[currentPhotoIndex];

            // 处理图片URL + 防缓存
            const imgUrl = (typeof currentItem === "string" ? currentItem : currentItem.url) + "?t=" + Date.now();
            
            // 图片加载容错：重新绑定onload/onerror，避免多次加载失效
            currentImg.onload = function() {
                loadingTip.style.display = "none"; // 隐藏加载提示
                state.currentImg = imgUrl;
                // 处理选项逻辑
                if (typeof currentItem === "object" && currentItem.hasChoice) {
                    state.showChoices = true;
                    state.currentChoices = currentItem.choices;
                    renderChoices();
                } else {
                    state.showChoices = false;
                    choicesWrapper.style.display = "none";
                }
            };

            currentImg.onerror = function() {
                loadingTip.style.display = "none";
                currentImg.src = "https://via.placeholder.com/1920x1080?text=图片加载失败，请点击屏幕继续";
                state.showChoices = typeof currentItem === "object" && currentItem.hasChoice;
                state.currentChoices = (typeof currentItem === "object" && currentItem.hasChoice) ? currentItem.choices : [];
                if (state.showChoices) {
                    renderChoices();
                } else {
                    choicesWrapper.style.display = "none";
                }
            };

            // 强制设置src，触发图片加载
            currentImg.src = imgUrl;
        }

        // 渲染选项按钮：修复点击穿透问题
        function renderChoices() {
            choicesWrapper.innerHTML = "";
            if (!state.showChoices || state.currentChoices.length === 0) {
                choicesWrapper.style.display = "none";
                return;
            }
            choicesWrapper.style.display = "flex";
            state.currentChoices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = choice.label;
                // 修复：阻止按钮点击事件冒泡到图片（避免触发switchImage）
                btn.onclick = function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    chooseOption(choice.nextScene, choice.nextPhotoIndex);
                };
                choicesWrapper.appendChild(btn);
            });
        }

        // 切换图片：核心修改——判断是否到最后一张，到了则标记isEnd并禁止后续操作
        function switchImage() {
            // 新增1：如果已到最后一张，直接返回，不做任何操作
            if (state.isEnd) {
                console.log("已播放至最后一张图，禁止翻页");
                return;
            }
            // 原有逻辑：有选项时跳过翻页
            if (state.showChoices) {
                console.log("当前有选项，跳过翻页");
                return;
            }

            const currentScene = scenes[state.currentSceneIndex];
            let newPhotoIndex = state.currentPhotoIndex + 1;
            let newSceneIndex = state.currentSceneIndex;

            // 检查当前场景的图片是否已到最后一张
            if (newPhotoIndex >= currentScene.photos.length) {
                newPhotoIndex = 0;
                // 新增2：判断是否是【最后一个场景】
                if (state.currentSceneIndex === scenes.length - 1) {
                    // 是最后一个场景的最后一张图，标记isEnd为true，直接返回
                    state.isEnd = true;
                    console.log("已播放完所有内容，停留在最后一张图");
                    return;
                }
                // 不是最后一个场景，正常切换到下一个场景
                newSceneIndex = (state.currentSceneIndex + 1) % scenes.length;
                console.log(`切换到新场景：${scenes[newSceneIndex].name}，第${newPhotoIndex+1}张图`);
            }

            // 更新状态并加载新图片
            state.currentSceneIndex = newSceneIndex;
            state.currentPhotoIndex = newPhotoIndex;
            loadCurrentImage();
        }

        // 选择选项：修复场景查找逻辑，增加容错
        function chooseOption(nextScene, nextPhotoIndex) {
            // 新增：如果已到最后一张，选项也禁止点击
            if (state.isEnd) return;
            
            const targetSceneIndex = scenes.findIndex(item => item.name === nextScene);
            // 容错：场景不存在时提示
            if (targetSceneIndex === -1) {
                alert(`剧情「${nextScene}」暂未开放，请选择其他选项！`);
                return;
            }

            // 检查目标图片索引是否有效
            if (nextPhotoIndex >= scenes[targetSceneIndex].photos.length) {
                alert("目标剧情图片不存在！");
                return;
            }

            // 更新状态并加载新图片
            state.currentSceneIndex = targetSceneIndex;
            state.currentPhotoIndex = nextPhotoIndex;
            state.showChoices = false;
            loadCurrentImage();
        }
    </script>
</body>
</html>
